<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova senha | Facil Imob</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand">
          <img class="brand-logo" src="/assets/logo-facilimob-full-cropped.png" alt="Facil Imob">
        </div>
        <h1 class="page-title">Criar nova senha</h1>
        <p class="page-subtitle">Digite uma senha com pelo menos 8 caracteres para acessar o painel.</p>
        <div id="status" class="status"></div>
        <form id="resetPasswordForm" class="form-grid login-step" hidden>
          <label class="field">
            <span class="label">Nova senha</span>
            <input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span class="label">Confirmar nova senha</span>
            <input class="input" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="btn primary" type="submit">Salvar senha e entrar</button>
        </form>
      </section>
    </main>
    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
