<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Simulador Facil Imob</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand">
          <img class="brand-logo" src="/assets/logo-facilimob-full-cropped.png" alt="Facil Imob">
        </div>
        <h1 class="page-title">Acesso interno</h1>
        <p class="page-subtitle">Entre com seu e-mail e senha administrativa.</p>
        <div id="status" class="status"></div>
        <form id="loginForm" class="form-grid login-step">
          <label class="field">
            <span class="label">E-mail</span>
            <input class="input" name="email" type="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span class="label">Senha</span>
            <input class="input" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn primary" type="submit">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            Entrar
          </button>
          <button class="btn ghost" type="button" data-forgot-password>Esqueci minha senha</button>
          <button class="btn ghost" type="button" data-show-link-login>Receber link por e-mail</button>
        </form>
        <div id="codeForm" class="form-grid login-step" hidden>
          <p class="sent-to" data-sent-to></p>
          <p class="login-help">Abra o e-mail recebido e clique em <strong>Entrar no painel</strong>. Caso não encontre a mensagem, verifique também a caixa de spam ou lixo eletrônico.</p>
          <button class="btn" type="button" data-resend>Reenviar link</button>
          <button class="btn ghost" type="button" data-change-email>Usar outro e-mail</button>
        </div>
      </section>
    </main>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
