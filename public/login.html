<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Simulador Facil Imob</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand">
          <img class="brand-logo" src="/assets/logo-facilimob-full-cropped.png" alt="Facil Imob">
        </div>
        <h1 class="page-title">Acesso interno</h1>
        <p class="page-subtitle">Informe seu e-mail para receber um código de acesso.</p>
        <div id="status" class="status"></div>
        <form id="loginForm" class="form-grid login-step">
          <label class="field">
            <span class="label">E-mail</span>
            <input class="input" name="email" type="email" autocomplete="email" required>
          </label>
          <button class="btn primary" type="submit">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
            Enviar código
          </button>
        </form>
        <div id="codeForm" class="form-grid login-step" hidden>
          <p class="sent-to" data-sent-to></p>
          <label class="field">
            <span class="label">Código de 6 dígitos</span>
            <input class="input code-input" name="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
          </label>
          <button class="btn" type="button" data-resend>Reenviar código</button>
          <button class="btn ghost" type="button" data-change-email>Usar outro e-mail</button>
        </div>
      </section>
    </main>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
