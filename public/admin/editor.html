<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor | Admin FacilImob</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/admin/admin.css">
    <style id="dynamicStyles"></style>
  </head>
  <body class="admin-app-body editor-body">
    <header class="admin-topbar editor-topbar">
      <div class="editor-page-heading">
        <a href="/admin/pages.html"><img src="/assets/logo-facilimob-horizontal-cropped.png" alt="FacilImob"></a>
        <div>
          <h1 id="pageTitle">Editor</h1>
          <p id="pageMeta"></p>
        </div>
      </div>
      <div class="editor-top-actions">
        <div class="editor-breakpoints" role="group" aria-label="Modo responsivo">
          <button class="secondary compact active" type="button" data-breakpoint="desktop">Desktop</button>
          <button class="secondary compact" type="button" data-breakpoint="tablet">Tablet</button>
          <button class="secondary compact" type="button" data-breakpoint="mobile">Mobile</button>
        </div>
        <span id="saveStatus">Carregando...</span>
        <button class="secondary compact" type="button" data-page-settings>Pagina</button>
        <button class="secondary compact" type="button" data-preview>Preview</button>
        <button class="compact" type="button" data-publish>Publicar</button>
        <button class="secondary compact" type="button" data-undo>Desfazer</button>
        <button class="secondary compact" type="button" data-redo>Refazer</button>
        <a class="admin-link" href="/admin/pages.html">Paginas</a>
      </div>
    </header>

    <main class="editor-shell">
      <aside class="editor-sidebar">
        <div class="editor-sidebar-tabs" role="tablist" aria-label="Editor">
          <button class="active" type="button" data-sidebar-tab="components">Componentes</button>
          <button type="button" data-sidebar-tab="page">Pagina</button>
        </div>
        <div data-sidebar-panel="components">
          <p class="editor-sidebar-help">Escolha o componente que deseja adicionar e arraste ate a area da direita.</p>
          <div class="editor-component-list" aria-label="Componentes">
          <button class="editor-palette-item" type="button" draggable="true" data-new-structure="section">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 18h16M6 8v8h12V8"/></svg></span>
            <span>Secao</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-structure="row">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h16v8H4zM12 8v8"/></svg></span>
            <span>Linha</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-structure="column">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h5v14H5zM14 5h5v14h-5z"/></svg></span>
            <span>Coluna</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="container">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9h8M8 13h5"/></svg></span>
            <span>Container/Caixa</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="text">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14M8 6v12M5 18h6"/></svg></span>
            <span>Texto</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="button">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8h14v8H5zM9 12h6"/></svg></span>
            <span>Botao</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="image">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 15l3-3 2 2 2-3 3 4M9 9h.01"/></svg></span>
            <span>Imagem</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="video">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5zM10 9l5 3-5 3z"/></svg></span>
            <span>Video</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="social">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM16 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM10.5 10.5l3 3"/></svg></span>
            <span>Redes Sociais</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="menu">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></span>
            <span>Menu</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          <button class="editor-palette-item" type="button" draggable="true" data-new-block="html">
            <span class="editor-component-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg></span>
            <span>HTML</span>
            <span class="editor-drag-handle" aria-hidden="true"></span>
          </button>
          </div>
        </div>
        <div class="editor-page-panel" data-sidebar-panel="page" hidden>
          <p class="editor-sidebar-help">Ajuste as configuracoes gerais desta pagina.</p>
          <label><span>Largura da pagina</span>
            <select data-page-field="pageWidth">
              <option value="1140px">1140px</option>
              <option value="1280px">1280px</option>
              <option value="full-width">full-width</option>
            </select>
          </label>
          <label><span>SEO title</span><input data-page-field="seo_title"></label>
          <label><span>SEO description</span><textarea data-page-field="seo_description"></textarea></label>
        </div>
        <div class="editor-element-panel" data-sidebar-panel="element" hidden>
          <div class="editor-element-header">
            <button class="editor-panel-icon-button" type="button" data-close-element-settings aria-label="Voltar para componentes">←</button>
            <h2 id="elementPanelTitle">Elemento</h2>
            <button class="editor-panel-icon-button" type="button" data-close-element-settings aria-label="Fechar configuracoes">×</button>
          </div>
          <div id="propertiesPanel" class="editor-properties-panel">
            <p class="editor-muted">Selecione uma secao, linha, coluna ou bloco.</p>
          </div>
          <button class="secondary editor-panel-close" type="button" data-close-element-settings>Fechar</button>
        </div>
      </aside>

      <section class="editor-stage">
        <div id="canvas" class="editor-canvas dynamic-page"></div>
      </section>

    </main>

    <dialog id="rowDialog" class="admin-dialog">
      <form method="dialog" class="admin-form">
        <h2>Adicionar linha</h2>
        <div class="editor-layout-grid">
          <button type="button" data-layout="1" title="1 coluna" aria-label="1 coluna">
            <span class="editor-layout-preview"><span style="flex:1"></span></span>
            <small>1 coluna</small>
          </button>
          <button type="button" data-layout="1,1" title="2 iguais" aria-label="2 iguais">
            <span class="editor-layout-preview"><span style="flex:1"></span><span style="flex:1"></span></span>
            <small>2 iguais</small>
          </button>
          <button type="button" data-layout="1,1,1" title="3 iguais" aria-label="3 iguais">
            <span class="editor-layout-preview"><span style="flex:1"></span><span style="flex:1"></span><span style="flex:1"></span></span>
            <small>3 iguais</small>
          </button>
          <button type="button" data-layout="1,1,1,1" title="4 iguais" aria-label="4 iguais">
            <span class="editor-layout-preview"><span style="flex:1"></span><span style="flex:1"></span><span style="flex:1"></span><span style="flex:1"></span></span>
            <small>4 iguais</small>
          </button>
          <button type="button" data-layout="8,4" title="8 / 4" aria-label="8 / 4">
            <span class="editor-layout-preview"><span style="flex:8"></span><span style="flex:4"></span></span>
            <small>8 / 4</small>
          </button>
          <button type="button" data-layout="4,8" title="4 / 8" aria-label="4 / 8">
            <span class="editor-layout-preview"><span style="flex:4"></span><span style="flex:8"></span></span>
            <small>4 / 8</small>
          </button>
          <button type="button" data-layout="3,9" title="3 / 9" aria-label="3 / 9">
            <span class="editor-layout-preview"><span style="flex:3"></span><span style="flex:9"></span></span>
            <small>3 / 9</small>
          </button>
          <button type="button" data-layout="9,3" title="9 / 3" aria-label="9 / 3">
            <span class="editor-layout-preview"><span style="flex:9"></span><span style="flex:3"></span></span>
            <small>9 / 3</small>
          </button>
        </div>
        <div class="admin-dialog-actions">
          <button class="secondary" type="button" data-close-row>Cancelar</button>
        </div>
      </form>
    </dialog>

    <input id="imageUpload" type="file" accept="image/*" hidden>

    <script type="module" src="/admin/editor.js"></script>
  </body>
</html>
