<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulacao | Simulador Facil Imob</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <div class="sidebar-backdrop"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="/assets/logo-facilimob-full-cropped.png" alt="Facil Imob">
        </div>
        <nav>
          <a class="side-link" data-nav="simulacao" href="/index.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V9"/><path d="M12 16V7"/><path d="M16 16v-4"/></svg>
            Simulacao
          </a>
          <a class="side-link" data-nav="historico" href="/historico.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/><path d="M12 7v5l3 2"/></svg>
            Historico
          </a>
          <a class="side-link" data-nav="settings" href="/settings.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
            Configuracoes
          </a>
        </nav>
      </aside>
      <div class="content">
        <header class="topbar">
          <div class="brand">
            <button class="btn ghost mobile-menu" type="button" data-menu aria-label="Abrir menu">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
            </button>
            <img class="brand-logo horizontal" src="/assets/logo-facilimob-horizontal-cropped.png" alt="Facil Imob">
          </div>
          <div class="user-actions">
            <span data-user></span>
            <button class="btn" type="button" data-logout>Sair</button>
          </div>
        </header>
        <main class="page">
          <div class="page-header">
            <div>
              <h1 class="page-title">Simulacao</h1>
              <p class="page-subtitle">Calcule a garantia, escolha a opcao e confira o total.</p>
            </div>
          </div>
          <div id="status" class="status"></div>
          <div class="grid-main">
            <section class="panel">
              <h2 class="section-title">Dados do cliente</h2>
              <form id="simulationForm" class="form-grid">
                <label class="field"><span class="label">Nome completo</span><input class="input" name="cliente_nome" required></label>
                <label class="field"><span class="label">CPF</span><input class="input" name="cliente_cpf" inputmode="numeric" placeholder="000.000.000-00" required></label>
                <label class="field"><span class="label">Telefone</span><input class="input" name="cliente_telefone" inputmode="numeric" placeholder="(00) 00000-0000" required></label>
                <label class="field"><span class="label">E-mail</span><input class="input" name="cliente_email" type="email" required></label>
                <label class="field"><span class="label">Valor mensal do aluguel</span><input class="input" name="valor_aluguel" inputmode="numeric" required></label>
                <button class="btn primary" type="submit">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
                  Simular
                </button>
              </form>
            </section>
            <section class="panel print-keep">
              <h2 class="section-title">Opcoes</h2>
              <div class="options-grid">
                <button class="option-card" type="button" data-option="com_fci">
                  <h3>Com FCI</h3>
                  <p class="value" data-value="com_fci">R$ 0,00</p>
                  <p class="muted">Produto cobre taxas e condominio</p>
                </button>
                <button class="option-card" type="button" data-option="sem_fci">
                  <h3>Sem FCI</h3>
                  <p class="value" data-value="sem_fci">R$ 0,00</p>
                  <p class="muted">Produto cobre taxas e condominio</p>
                </button>
              </div>
              <div class="summary-box">
                <div class="summary-item"><span>Total selecionado</span><strong id="selectedTotal">R$ 0,00</strong></div>
              </div>
              <div id="emptySummary" class="summary-box">
                <p class="muted">O resumo completo aparece apos simular.</p>
              </div>
              <div id="summary" class="summary" hidden></div>
              <div id="resultActions" class="actions" hidden>
                <button class="btn primary" type="button" data-generate-pix>Gerar Pix</button>
                <button class="btn" type="button" data-export-pdf>Salvar PDF</button>
                <button class="btn" type="button" data-export-jpeg>Salvar JPEG</button>
                <button class="btn" type="button" data-print>Imprimir</button>
                <button class="btn" type="button" data-new>Nova simulacao</button>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <div id="pixModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-pix-modal></div>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pixModalTitle">
        <div class="modal-header">
          <h2 id="pixModalTitle" class="section-title">Pix gerado</h2>
          <button class="btn" type="button" data-close-pix-modal>Fechar</button>
        </div>
        <div id="pixModalSummary" class="summary"></div>
        <div class="actions">
          <button class="btn primary" type="button" data-copy-pix>Copiar Pix</button>
        </div>
      </section>
    </div>
    <script src="/vendor/html2canvas/html2canvas.min.js"></script>
    <script src="/vendor/jspdf/jspdf.umd.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
